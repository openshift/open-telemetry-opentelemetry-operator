apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: openshift-namespace-annotations
spec:
  try:
    # In OpenShift, when a namespace is created, all necessary SCC annotations are automatically added.
    # However, if a namespace is created using a resource file with only selected SCCs, the other auto-added SCCs are not included.
    # Therefore, the UID-range and supplemental groups SCC annotations must be set after the namespace is created.
    # Some instrumentation requires root privileges (uid=0) for proper functionality.
    #
    # Wait for the namespace controller to apply default SCC annotations before
    # overwriting them. Without this wait, a race exists: the controller may set
    # the default uid-range after our annotation, reverting it.
    - command:
        entrypoint: bash
        args:
          - -c
          - |
            for i in $(seq 1 30); do
              if kubectl get namespace "${NAMESPACE}" -o jsonpath='{.metadata.annotations.openshift\.io/sa\.scc\.uid-range}' 2>/dev/null | grep -q .; then
                break
              fi
              sleep 1
            done
    - command:
        entrypoint: kubectl
        args:
          - annotate
          - namespace
          - ${NAMESPACE}
          - openshift.io/sa.scc.uid-range=1000/1000
          - --overwrite
    - command:
        entrypoint: kubectl
        args:
          - annotate
          - namespace
          - ${NAMESPACE}
          - openshift.io/sa.scc.supplemental-groups=3000/3000
          - --overwrite